default-rule-path: /var/lib/suricata/rules
rule-files:
  - local.rules

outputs:
  - eve-log:
      enabled: yes
      filetype: regular
      filename: eve.json
      types:
        - alert:
            payload: yes
            payload-printable: yes
        - dns
        - http
        - tls
        - files

Что это даёт
default-rule-path указывает, где лежат правила.

rule-files подключает local.rules.

eve-log включает JSON-вывод.

eve.json будет содержать алерты, DNS, HTTP, TLS и файловые события.
